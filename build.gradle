buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

ext {
    androidXVersion = '1.3.1'
    versionCompiler = 36
    versionTarget = 36
    minSdkVersion = 28
    versionCode = 130
    versionNameString = '0.10.1'
    javaSourceCompatibility = JavaVersion.VERSION_1_8
    javaTargetCompatibility = JavaVersion.VERSION_1_8
    supportLibVersion = '28.0.0'  // Mis à jour pour AndroidX
    versionBuildTool = '27.0.3'
    kotlinCoreVersion = '1.9.0'
    kotlinCoroutines = '1.6.0'  // Version mise à jour des coroutines
    materialVersion = '1.6.0'  // Mise à jour de Material Design
    constraintlayoutVersion = '2.1.4'  // Version plus récente
    lifecycle_version = '2.5.1'  // Mise à jour de Lifecycle
    quick_version = '2.9.50'
    dialog_version = '3.2.1'
}
